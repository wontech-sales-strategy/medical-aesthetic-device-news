name: Medical Aesthetic Device News 수집

on:
  schedule:
    - cron: "30 22 * * 0-4"   # 평일 KST 07:30
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:            # 수집이 동시에 2개 돌지 않도록 순서대로 실행
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 의존성 설치
        run: pip install -r requirements.txt
      - name: 네이버 뉴스 수집
        working-directory: collectors
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python naver_news.py
      - name: 해외 RSS 수집
        working-directory: collectors
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python overseas_rss.py

      - name: MFDS 에스테틱 허가 후보 수집
        working-directory: collectors
        env:
          MFDS_API_KEY: ${{ secrets.MFDS_API_KEY }}
        run: python mfds_approvals.py
        
      - name: KIPRIS 특허 트렌드
        working-directory: collectors
        continue-on-error: true
        env:
          KIPRIS_API_KEY: ${{ secrets.KIPRIS_API_KEY }}
        run: python kipris_patents.py
      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name "news-clipping-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/*.json docs/data/*.json
          git diff --quiet --cached || git commit -m "chore: device news update $(date -u +'%Y-%m-%d %H:%M UTC')"
          # 그사이 다른 커밋이 올라왔으면 받아서 합친 뒤(데이터는 이번 수집본 우선) 다시 푸시, 최대 3회
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs || { git rebase --abort; exit 1; }
            sleep 5
          done
          exit 1
