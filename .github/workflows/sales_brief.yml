name: 영업부문 아침 메일
run-name: "영업부문 아침 메일 (${{ github.event_name == 'schedule' && 'all' || inputs.send_mode }})"

on:
  schedule:
    # GitHub 예약 실행은 수십 분~몇 시간 늦게 시작될 수 있어 일찍 시작해 두고, 09시 직전까지 기다렸다가 발송
    - cron: "17 21 * * 0-4"   # 평일 KST 06:17 시작 (1차)
    - cron: "43 22 * * 0-4"   # 평일 KST 07:43 시작 (예비) — 이미 발송했으면 자동으로 건너뜀
  workflow_dispatch:
    inputs:
      send_mode:
        description: "test=테스트 수신자에게만 / all=영업부문 전체 / auto=자동발송용"
        type: choice
        options: [test, all, auto]   # auto = 외부 예약(cron-job.org)용: 수집 → 중복확인 → 발송
        default: test

permissions:
  contents: read
  actions: read

concurrency:            # 동시에 2개가 돌지 않도록 순서대로 실행
  group: sales-brief
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 08:50(KST)까지 대기
        if: (github.event_name == 'schedule' || inputs.send_mode == 'auto')
        run: |
          target=$(TZ=Asia/Seoul date -d "today 08:50" +%s); now=$(date +%s)
          if [ "$now" -lt "$target" ]; then echo "$(( (target-now)/60 ))분 대기"; sleep $((target-now)); else echo "이미 지남 → 바로 진행"; fi

      - name: 최신 뉴스 수집 (네이버)
        if: (github.event_name == 'schedule' || inputs.send_mode == 'auto')
        continue-on-error: true
        working-directory: collectors
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_CHECK_MAX: "120"      # 9시 발송이 늦지 않도록 메일 작업 안에서는 새 기사 위주로 짧게 검수
          AI_CHECK_SECONDS: "100"
        run: python naver_news.py
      - name: 최신 뉴스 수집 (해외)
        if: (github.event_name == 'schedule' || inputs.send_mode == 'auto')
        continue-on-error: true
        working-directory: collectors
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_CHECK_MAX: "120"      # 9시 발송이 늦지 않도록 메일 작업 안에서는 새 기사 위주로 짧게 검수
          AI_CHECK_SECONDS: "100"
        run: python overseas_rss.py

      - name: 오늘 이미 발송했는지 확인
        id: guard
        if: (github.event_name == 'schedule' || inputs.send_mode == 'auto')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          today=$(TZ=Asia/Seoul date +%Y-%m-%d)
          n=$(gh run list -R "$GITHUB_REPOSITORY" -w sales_brief.yml -L 40 --json databaseId,displayTitle,conclusion,createdAt \
            | jq --arg t "$today" --arg me "$GITHUB_RUN_ID" '[.[] | select(.conclusion=="success" and ((.databaseId|tostring)!=$me) and ((.displayTitle|test("test"))|not) and (((.createdAt|sub("\\.[0-9]+Z$";"Z")|fromdateiso8601)+32400|strftime("%Y-%m-%d"))==$t))] | length')
          echo "오늘($today) 이미 발송된 횟수: $n"
          echo "already=$n" >> "$GITHUB_OUTPUT"

      - name: 영업부문 아침 브리핑 메일 발송
        if: ${{ !(github.event_name == 'schedule' || inputs.send_mode == 'auto') || steps.guard.outputs.already == '0' }}
        env:
          SEND_MODE: ${{ (github.event_name == 'schedule' || inputs.send_mode == 'auto') && 'all' || inputs.send_mode }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SALES_EMAIL_TO: ${{ secrets.SALES_EMAIL_TO }}
          SALES_EMAIL_TEST_TO: ${{ secrets.SALES_EMAIL_TEST_TO }}
          SALES_EMAIL_REPLY_TO: ${{ secrets.SALES_EMAIL_REPLY_TO }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WONTECH_REGION_SHARE: ${{ secrets.WONTECH_REGION_SHARE }}   # 사내 대륙별 매출 비중(JSON) — 저장소에 두지 않음
        run: python send_sales_brief.py
