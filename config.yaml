sources:
  naver_news:
    enabled: true
    display: 100
    max_pages: 2
    sort: date
  overseas_rss:
    enabled: true
    # Google News RSS 검색 (영문, 최근 7일). query만 바꾸면 수집 대상이 바뀝니다.
    # Google News RSS 검색. edition = 국가판(언어/국가), country = 대시보드 표시 국가명
    # local: true 인 검색은 현지어 기사라 '주제어' 검사를 생략하고 제외어만 적용합니다.
    per_query_limit: 40
    google_news:
      # ── 글로벌(영문) ──
      - name: "경쟁사·브랜드"
        edition: "en-US|US|US:en"
        country: "글로벌"
        query: '(InMode OR Ultherapy OR Thermage OR Sofwave OR Classys OR Jeisys OR Lutronic OR "Cynosure Lutronic" OR "Candela Medical" OR Cutera OR "Solta Medical" OR "Merz Aesthetics" OR Hironic OR Asterasys OR Laseroptek OR SHENB OR "Alma Lasers" OR Fotona OR Lumenis OR "VIOL Co" OR Morpheus8 OR Potenza OR Sylfirm OR Ultraformer OR Fraxel OR PicoWay OR PicoSure) when:7d'
      - name: "기술 트렌드"
        edition: "en-US|US|US:en"
        country: "글로벌"
        query: '("radiofrequency microneedling" OR "focused ultrasound" skin OR "picosecond laser" OR "energy-based device" OR "aesthetic laser" OR "skin tightening device") when:7d'
      - name: "시장·규제"
        edition: "en-US|US|US:en"
        country: "글로벌"
        query: '("medical aesthetics" OR "aesthetic medical device" OR "aesthetic device") (FDA OR market OR launch OR approval) when:7d'
      - name: "글로벌 기업·M&A"
        edition: "en-US|US|US:en"
        country: "글로벌"
        query: '("BTL Aesthetics" OR "Venus Concept" OR Sciton OR "Allergan Aesthetics" OR Galderma OR "Bausch Health" Solta OR "Alma Lasers" OR Sisram OR "El.En" OR Lumenis OR "Candela Medical") (aesthetic OR device OR laser OR revenue OR acquisition) when:7d'
      - name: "업계 동향"
        edition: "en-US|US|US:en"
        country: "글로벌"
        query: '("medical aesthetics" OR "aesthetic industry" OR "med spa industry" OR "aesthetic device market" OR "body contouring device" OR "skin rejuvenation device" OR "home beauty device") when:7d'
      - name: "원텍"
        edition: "en-US|US|US:en"
        country: "글로벌"
        query: '(WONTECH OR Oligio OR Lavieen OR PicoCare) when:30d'
      - name: "써지컬: 비뇨·정맥"
        edition: "en-US|US|US:en"
        country: "글로벌"
        query: '("holmium laser" OR HoLEP OR "laser lithotripsy" OR "thulium fiber laser" OR "MOSES laser" OR "Cyber Ho" OR "Quanta System" OR biolitec OR "LSO Medical" OR "endovenous laser" OR EVLA OR EVLT OR "varicose vein laser" OR "Boston Scientific" laser) when:7d'
      - name: "써지컬: 여성·CO2·통증"
        edition: "en-US|US|US:en"
        country: "글로벌"
        query: '("MonaLisa Touch" OR "vaginal laser" OR "vaginal rejuvenation" laser OR CO2RE OR SmartXide OR "fractional CO2 laser" OR photobiomodulation OR "Multi Radiance" OR Erchonia OR "high intensity laser therapy") when:7d'
      - name: "원텍 써지컬"
        edition: "en-US|US|US:en"
        country: "글로벌"
        query: '(Holinwon OR Veincare OR Beladona OR Scahil OR "WONTECH Ellise") when:30d'
      # ── 국가별 영문판 ──
      - {name: "영국", edition: "en-GB|GB|GB:en", country: "영국", query: '("aesthetic clinic" OR "medical aesthetics" OR HIFU OR Ultherapy OR Thermage OR InMode OR Morpheus8 OR "skin tightening" OR "laser skin") when:7d'}
      - {name: "호주", edition: "en-AU|AU|AU:en", country: "호주", query: '("cosmetic clinic" OR "medical aesthetics" OR HIFU OR Ultherapy OR Thermage OR Morpheus8 OR "skin tightening" OR "laser skin") when:7d'}
